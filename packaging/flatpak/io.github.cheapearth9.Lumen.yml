# Flatpak manifest for Lumen Host. The app is the prebuilt dotnet publish output.
# CI (packaging/flatpak/build-flatpak.sh) stages these files into ./payload first:
#   lumenhost (single-file binary), ffmpeg (static), lumen-host.desktop, lumen.png
#
# The org.freedesktop.Platform.ffmpeg-full extension only ships libraries (no ffmpeg CLI),
# which is not what Lumen needs, so a static ffmpeg binary is bundled instead.
# Limitation: xdpyinfo / xrandr are not in the runtime, so the host falls back to its defaults for
# display detection when run inside the sandbox.
app-id: io.github.cheapearth9.Lumen
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: lumenhost
finish-args:
  - --share=network
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=/run/usbmuxd
modules:
  - name: lumen-host
    buildsystem: simple
    build-commands:
      - install -Dm755 lumenhost /app/bin/lumenhost
      - install -Dm755 ffmpeg /app/bin/ffmpeg
      - sed -i 's/^Icon=.*/Icon=io.github.cheapearth9.Lumen/' lumen-host.desktop
      - install -Dm644 lumen-host.desktop /app/share/applications/io.github.cheapearth9.Lumen.desktop
      - install -Dm644 lumen.png /app/share/icons/hicolor/512x512/apps/io.github.cheapearth9.Lumen.png
    sources:
      - type: file
        path: payload/lumenhost
      - type: file
        path: payload/ffmpeg
      - type: file
        path: payload/lumen-host.desktop
      - type: file
        path: payload/lumen.png
