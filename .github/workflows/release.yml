name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Next version
    runs-on: ubuntu-latest
    outputs:
      v: ${{ steps.next.outputs.v }}
    steps:
      # Bug fixes bump the last number (1.2 -> 1.2.1 -> 1.2.2). A push whose commit message contains [major] bumps the
      # middle number instead (1.2.2 -> 1.3), and after .9 it rolls over (1.9 -> 2.0, never 1.10). Never the run number.
      - id: next
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          tags=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --paginate --jq '.[].tag_name' 2>/dev/null || true)
          best=$(echo "$tags" | sed -n 's/^v\([0-9]\+\)\.\([0-9]\+\)\(\.\([0-9]\+\)\)\?$/\1 \2 \4/p' | sed 's/ $/ 0/' | awk '{ if (NF==2) $3=0; print }' | sort -k1,1n -k2,2n -k3,3n | tail -1)
          if [ -z "$best" ]; then
            v="1.0"
          else
            set -- $best; maj=$1; min=$2; pat=${3:-0}
            # Bug fixes bump the 3rd number; after .9 (2.0.9) the next release is a major one (2.1), then 2.1.1, 2.1.2 ...
            if echo "$MSG" | grep -qi '\[major\]' || [ "$pat" -ge 9 ]; then
              if [ "$min" -ge 9 ]; then v="$((maj + 1)).0"; else v="$maj.$((min + 1))"; fi
            else
              v="$maj.$min.$((pat + 1))"
            fi
          fi
          echo "next version: $v (existing: $(echo $tags | tr '\n' ' '))"
          echo "v=$v" >> "$GITHUB_OUTPUT"

  apple:
    name: iOS .ipa + macOS host
    needs: version
    env:
      LUMEN_VERSION: ${{ needs.version.outputs.v }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Stamp version into project (becomes CFBundleShortVersionString / CFBundleVersion in Info.plist)
        run: |
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"$LUMEN_VERSION\"/; s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
          grep -n "MARKETING_VERSION\|CURRENT_PROJECT_VERSION" project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS client (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme LumenClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Check version in built Info.plist
        run: |
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          v=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          echo "Info.plist version: $v"
          [ "$v" = "$LUMEN_VERSION" ] || { echo "version mismatch ($v vs $LUMEN_VERSION)"; exit 1; }

      - name: Package .ipa
        run: |
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry Lumen-iOS.ipa Payload && rm -rf Payload)

      - name: Build macOS host
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme LumenHost \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/mac \
            build

      - name: Package macOS host (.dmg)
        run: |
          APP=build/mac/Build/Products/Release/LumenHost.app
          codesign --force --deep -s - "$APP"
          APPNAME=$(basename "$APP")
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          DMG=dist/Lumen-Host-macOS.dmg
          rm -f "$DMG"

          brew install create-dmg || true

          # run a command with a watchdog (create-dmg drives Finder via AppleScript, which can hang on CI)
          run_limited() {
            "$@" &
            local pid=$! n=0
            while kill -0 "$pid" 2>/dev/null; do
              if [ "$n" -ge 180 ]; then kill -9 "$pid" 2>/dev/null || true; return 124; fi
              sleep 1; n=$((n+1))
            done
            wait "$pid"
          }
          cleanup() {
            hdiutil detach "/Volumes/Lumen Host" -force >/dev/null 2>&1 || true
            rm -f "$DMG" dist/rw.*.dmg
          }

          made=0
          if command -v create-dmg >/dev/null; then
            # 1) full layout (window 540x340, app on the left, Applications link on the right)
            if run_limited create-dmg --volname "Lumen Host" \
                 --window-pos 200 120 --window-size 540 340 --icon-size 100 \
                 --icon "$APPNAME" 140 170 --app-drop-link 400 170 \
                 --hide-extension "$APPNAME" "$DMG" dist/dmg; then
              made=1
            else
              echo "create-dmg (layout) failed, retrying without Finder styling"
              cleanup
              # 2) same content, no AppleScript styling
              if run_limited create-dmg --volname "Lumen Host" --skip-jenkins \
                   --window-size 540 340 --app-drop-link 400 170 "$DMG" dist/dmg; then
                made=1
              else
                cleanup
              fi
            fi
          fi
          if [ "$made" -ne 1 ] || [ ! -f "$DMG" ]; then
            echo "falling back to plain hdiutil"
            ln -s /Applications dist/dmg/Applications
            hdiutil create -volname "Lumen Host" -srcfolder dist/dmg -ov -format UDZO "$DMG"
          fi
          rm -rf dist/dmg
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            dist/Lumen-iOS.ipa
            dist/Lumen-Android.apk
            dist/Lumen-Host-macOS.dmg
          if-no-files-found: error

  windows:
    name: Windows host
    needs: version
    env:
      LUMEN_VERSION: ${{ needs.version.outputs.v }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish HostWindows/LumenHost.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          -p:Version=${{ env.LUMEN_VERSION }}
          -o dist/win

      - name: Bundle ffmpeg (LGPL build with NVENC / AMF / Quick Sync)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The master build needs the very newest NVIDIA driver (NVENC API 13.1) and silently falls back to the CPU on
          # older drivers. Prefer a release-branch build, which targets an older NVENC API that more drivers support.
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "lumen-ci" }
          $rel = Invoke-RestMethod "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest" -Headers $h
          $names = $rel.assets | ForEach-Object { $_.name } | Where-Object { $_ -match '^ffmpeg-n[0-9.]+-latest-win64-gpl-[0-9.]+\.zip$' }
          Write-Host "release-branch builds: $($names -join ', ')"
          $pick = $null
          foreach ($pref in @('n7.1', 'n7.0', 'n8.0', 'n6.1')) { $pick = $names | Where-Object { $_ -like "ffmpeg-$pref-*" } | Select-Object -First 1; if ($pick) { break } }
          if (-not $pick) { $pick = $names | Select-Object -First 1 }
          if (-not $pick) { $pick = "ffmpeg-master-latest-win64-gpl.zip" }
          Write-Host "bundling $pick"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$pick" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $root = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          Copy-Item "$root/bin/ffmpeg.exe" dist/win/ffmpeg.exe
          if (Test-Path "$root/LICENSE.txt") { Copy-Item "$root/LICENSE.txt" dist/win/FFMPEG-LICENSE.txt }

      - name: Bundle adb (Android USB cable mode)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          New-Item -ItemType Directory -Force dist/win/platform-tools | Out-Null
          foreach ($f in @('adb.exe', 'AdbWinApi.dll', 'AdbWinUsbApi.dll')) { Copy-Item "pt/platform-tools/$f" dist/win/platform-tools/ }
          Get-ChildItem dist/win/platform-tools | Format-Table Name, Length

      - name: Fetch SudoVDA virtual display driver (from Apollo's release)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "lumen-ci" }
          $rel = Invoke-RestMethod "https://api.github.com/repos/ClassicOldSong/Apollo/releases/latest" -Headers $h
          Write-Host "Apollo release $($rel.tag_name):"; $rel.assets | ForEach-Object { Write-Host "  $($_.name)" }
          $asset = $rel.assets | Where-Object { $_.name -match '\.exe$' -and $_.name -notmatch 'arm|debug|portable' } | Select-Object -First 1
          if (-not $asset) { throw "no Windows asset found in the Apollo release" }
          Write-Host "using $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile apollo.bin -Headers $h
          New-Item -ItemType Directory -Force apollo_x | Out-Null
          if ($asset.name -match '\.zip$') { Expand-Archive apollo.bin -DestinationPath apollo_x -Force } else { 7z x apollo.bin -oapollo_x -y | Select-Object -Last 3 }
          $inf = Get-ChildItem apollo_x -Recurse -Filter SudoVDA.inf | Select-Object -First 1
          if (-not $inf) { throw "SudoVDA.inf not found in the Apollo package" }
          $dir = $inf.Directory.FullName
          Write-Host "driver dir: $dir"; Get-ChildItem $dir | Format-Table Name, Length
          if (-not (Test-Path "$dir/SudoVDA.dll")) { throw "SudoVDA.dll is not next to the INF" }
          New-Item -ItemType Directory -Force dist/win/drivers/sudovda | Out-Null
          Copy-Item "$dir/*" dist/win/drivers/sudovda -Recurse -Force
          if (-not (Test-Path dist/win/drivers/sudovda/nefconc.exe)) {
            $n = Get-ChildItem apollo_x -Recurse -Filter nefconc.exe | Select-Object -First 1
            if ($n) { Copy-Item $n.FullName dist/win/drivers/sudovda/nefconc.exe }
            else {
              $nr = Invoke-RestMethod "https://api.github.com/repos/nefarius/nefcon/releases/latest" -Headers $h
              $na = $nr.assets | Where-Object { $_.name -match '^nefcon.*\.zip$' } | Select-Object -First 1
              Invoke-WebRequest -Uri $na.browser_download_url -OutFile nefcon.zip -Headers $h
              Expand-Archive nefcon.zip -DestinationPath nefcon -Force
              $x = Get-ChildItem nefcon -Recurse -Filter nefconc.exe | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
              if (-not $x) { $x = Get-ChildItem nefcon -Recurse -Filter nefconc.exe | Select-Object -First 1 }
              Copy-Item $x.FullName dist/win/drivers/sudovda/nefconc.exe
            }
          }
          Get-ChildItem dist/win/drivers/sudovda | Format-Table Name, Length

      - name: Fetch ViGEmBus (virtual Xbox 360 controller driver)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "lumen-ci" }
          $rel = Invoke-RestMethod "https://api.github.com/repos/nefarius/ViGEmBus/releases/latest" -Headers $h
          $asset = $rel.assets | Where-Object { $_.name -match '\.exe$' } | Select-Object -First 1
          if (-not $asset) { throw "no ViGEmBus installer found" }
          New-Item -ItemType Directory -Force dist/win/drivers/vigem | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile dist/win/drivers/vigem/ViGEmBus_Setup.exe -Headers $h
          Get-ChildItem dist/win/drivers/vigem | Format-Table Name, Length

      - name: Verify bundled files
        shell: pwsh
        run: |
          foreach ($f in @('dist/win/LumenHost.exe', 'dist/win/ffmpeg.exe')) {
            if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 }
          }
          $v = & dist/win/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { Write-Error "ffmpeg.exe does not run"; exit 1 }
          $v | Select-Object -First 1
          if (-not ($v -match 'libx265')) { Write-Warning "this ffmpeg build has no libx265 (software HEVC fallback)" }
          Get-ChildItem dist/win | Format-Table Name, Length

      - name: Zip (portable)
        shell: pwsh
        run: Compress-Archive -Path dist/win/* -DestinationPath dist/Lumen-Host-Windows.zip

      - name: Locate Inno Setup
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $cands = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
            $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
              Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { Write-Error "ISCC.exe not found"; exit 1 }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=$env:LUMEN_VERSION" "/DSourceDir=$env:GITHUB_WORKSPACE\dist\win" "/O$env:GITHUB_WORKSPACE\dist" HostWindows/installer/LumenHost.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed"; exit 1 }
          if (-not (Test-Path dist/Lumen-Host-Setup.exe)) { Write-Error "installer not produced"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Lumen-Host-Setup.exe
            dist/Lumen-Host-Windows.zip
          if-no-files-found: error

  linux:
    name: Linux host (${{ matrix.arch }})
    needs: version
    env:
      LUMEN_VERSION: ${{ needs.version.outputs.v }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: linux-x64
            deb: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish HostLinux/LumenHost.Linux.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          -p:Version=${{ env.LUMEN_VERSION }}
          -o dist/publish

      - name: Verify publish output
        run: |
          test -f dist/publish/lumenhost || { echo "lumenhost missing"; ls -la dist/publish; exit 1; }
          chmod +x dist/publish/lumenhost
          ls -la dist/publish

      - name: Build .deb
        run: packaging/linux/build-deb.sh "$LUMEN_VERSION" "${{ matrix.deb }}" dist/publish/lumenhost dist/out

      - name: Build Arch package (.pkg.tar.zst)
        if: matrix.arch == 'x64'
        continue-on-error: true
        run: packaging/arch/build-in-container.sh "$LUMEN_VERSION" dist/publish/lumenhost dist/out

      - name: Build AppImage
        if: matrix.arch == 'x64'
        continue-on-error: true
        run: packaging/appimage/build-appimage.sh "$LUMEN_VERSION" ${{ matrix.arch }} dist/publish/lumenhost dist/out

      - name: Install flatpak-builder
        if: matrix.arch == 'x64'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Build Flatpak
        if: matrix.arch == 'x64'
        continue-on-error: true
        run: packaging/flatpak/build-flatpak.sh dist/publish/lumenhost dist/out

      - name: List packages
        if: always()
        run: ls -la dist/out || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.arch }}
          path: dist/out/*
          if-no-files-found: warn

  android:
    name: Android client
    needs: version
    # Never blocks the release: the iOS / host builds publish even if this job fails.
    continue-on-error: true
    env:
      LUMEN_VERSION: ${{ needs.version.outputs.v }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Accept SDK licenses and make sure platform 34 is installed
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" "platforms;android-34" "build-tools;34.0.0" > /dev/null || true
          fi

      - name: Create signing keystore (debug-style, generated for this build)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/lumen.keystore" -storepass android -keypass android \
            -alias lumen -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Lumen, O=Lumen, C=US"

      - name: Build APK
        working-directory: Android
        run: >
          gradle --no-daemon assembleRelease
          -PlumenVersionName=${{ env.LUMEN_VERSION }}
          -PlumenVersionCode=${{ github.run_number }}
          -PlumenKeystore=$RUNNER_TEMP/lumen.keystore
          -PlumenKeystorePass=android
          -PlumenKeyAlias=lumen

      - name: Package
        run: |
          mkdir -p dist
          APK=$(find Android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          echo "APK: $APK"
          cp "$APK" dist/Lumen-Android.apk
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/Lumen-Android.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, apple, windows, linux, android]
    if: always() && needs.apple.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.v }}
          name: Lumen v${{ needs.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/Lumen-iOS.ipa
            dist/Lumen-Android.apk
            dist/Lumen-Host-macOS.dmg
            dist/Lumen-Host-Setup.exe
            dist/Lumen-Host-Windows.zip
            dist/lumenhost_*.deb
            dist/lumenhost-*.pkg.tar.zst
            dist/Lumen-Host-*.AppImage
            dist/Lumen-Host.flatpak
