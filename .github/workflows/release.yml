name: Build & Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apple:
    name: iOS .ipa + macOS host
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS client (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme LumenClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          APP=$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)
          echo "App bundle: $APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry Lumen-iOS.ipa Payload && rm -rf Payload)

      - name: Build macOS host
        run: |
          set -o pipefail
          xcodebuild \
            -project Lumen.xcodeproj \
            -scheme LumenHost \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/mac \
            build

      - name: Package macOS host (.dmg)
        run: |
          APP=build/mac/Build/Products/Release/LumenHost.app
          codesign --force --deep -s - "$APP"
          mkdir -p dist/dmg
          cp -R "$APP" dist/dmg/
          hdiutil create -volname "Lumen Host" -srcfolder dist/dmg -ov -format UDZO dist/Lumen-Host-macOS.dmg
          rm -rf dist/dmg

      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: |
            dist/Lumen-iOS.ipa
            dist/Lumen-Host-macOS.dmg
          if-no-files-found: error

  windows:
    name: Windows host
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish HostWindows/LumenHost.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None
          -o dist/win

      - name: Bundle ffmpeg (LGPL build with NVENC / AMF / Quick Sync)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg
          $root = (Get-ChildItem ffmpeg -Directory | Select-Object -First 1).FullName
          Copy-Item "$root/bin/ffmpeg.exe" dist/win/ffmpeg.exe
          if (Test-Path "$root/LICENSE.txt") { Copy-Item "$root/LICENSE.txt" dist/win/FFMPEG-LICENSE.txt }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/win/* -DestinationPath Lumen-Host-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Lumen-Host-Windows.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [apple, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List files
        run: ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lumen v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            dist/Lumen-iOS.ipa
            dist/Lumen-Host-macOS.dmg
            dist/Lumen-Host-Windows.zip
